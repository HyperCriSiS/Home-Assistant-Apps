name: "Calibre AIO"
description: "Shelfmark book discovery and Calibre library management in one interface"
version: "0.1.3"
stage: experimental
slug: "calibre-aio"
init: false
arch:
  - aarch64
  - amd64
icon: false
url: "https://github.com/HyperCriSiS/Home-Assistant-Apps/tree/main/Calibre%20AIO"
panel_icon: "mdi:bookshelf"
panel_title: "Calibre AIO"
panel_admin: false
startup: services
ingress: true
ingress_port: 8084
ports: {}
map:
  - share:rw
options:
  start_page: "library"
  library_dir: "calibre-aio/library"
  ingest_dir: "calibre-aio/ingest"
  network_share_mode: false
  shelfmark:
    external_bypass_url: ""
  sso:
    enabled: true
    admin_username: ""
    admin_account: "admin"
    auto_create_users: true
schema:
  start_page: "list(library|shelfmark)"
  library_dir: "str"
  ingest_dir: "str"
  network_share_mode: "bool"
  shelfmark:
    external_bypass_url: "str?"
  sso:
    enabled: "bool"
    admin_username: "str"
    admin_account: "str"
    auto_create_users: "bool"
