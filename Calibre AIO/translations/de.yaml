---
configuration:
  start_page:
    name: Startseite
    description: Zuerst Bibliothek (library) oder Shelfmark (shelfmark) öffnen.
  library_dir:
    name: Bibliotheksordner
    description: Pfad relativ zu /share.
  ingest_dir:
    name: Importordner
    description: Pfad relativ zu /share für abgeschlossene Buchdownloads.
  network_share_mode:
    name: Netzwerkfreigabe
    description: Für SMB/NFS regelmäßige Prüfung statt Dateisystemereignissen verwenden.
  shelfmark:
    name: Shelfmark
    description: Download-Einstellungen.
    fields:
      external_bypass_url:
        name: Externer Browser-Dienst (optional)
        description: HTTP(S)-Adresse eines kompatiblen Browser-Challenge-Dienstes.
  sso:
    name: SSO
    description: Anmeldung über Home Assistant.
    fields:
      enabled:
        name: SSO aktivieren
        description: Für Calibre AIO aktiviert lassen.
      admin_username:
        name: Administrator
        description: 'HA-Anmeldename, nicht Anzeigename oder ID. Leer: Einrichtung beim Öffnen der App.'
      admin_account:
        name: CWA-Administratorkonto
        description: Vorhandenes Administratorkonto in Calibre-Web Automated.
      auto_create_users:
        name: Benutzer automatisch anlegen
        description: Für andere HA-Benutzer CWA-Lesekonten erstellen.
