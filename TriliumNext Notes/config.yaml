---
name: "Trilium Notes"
version: "v2026.11.05"
slug: trilium
description: >-
  Trilium v0.106.1 - hierarchical note-taking and personal knowledge base.
url: "https://github.com/HyperCriSiS/Home-Assistant-Apps/tree/dev-trilium/TriliumNext%20Notes"
ingress: true
ingress_port: 8080
ingress_stream: true
panel_icon: mdi:notebook-multiple
panel_title: "Trilium Notes (Dev)"
webui: "http://[HOST]:[PORT:8080]/"
watchdog: "tcp://[HOST]:[PORT:8080]"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
stage: experimental
# Stop Trilium during backups so the SQLite database is captured consistently.
backup: cold
map:
  - type: data
    read_only: false
    path: /home/node/trilium-data
# Disabled by default: direct access bypasses Home Assistant authentication.
ports:
  "8080/tcp": null
ports_description:
  "8080/tcp": "Trilium web interface for direct access or sync clients (not required for Ingress)"
options: {}
schema:
  # Kept temporarily for compatibility with existing installations.
  timezone: "str?"
  log_retention_days: "int(1,3650)?"
  log_level: "list(trace|debug|info|notice|warning|error|fatal)?"
  https_only: "bool?"
environment:
  TRILIUM_DATA_DIR: "/home/node/trilium-data"
  TRILIUM_NETWORK_HOST: "0.0.0.0"
  TRILIUM_NETWORK_PORT: "8080"
  TRILIUM_NETWORK_TRUSTEDREVERSEPROXY: "172.30.32.2"
