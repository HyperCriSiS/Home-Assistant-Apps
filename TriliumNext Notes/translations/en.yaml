---
configuration:
  timezone:
    name: "Timezone (deprecated)"
    description: >-
      No longer used. The container follows the Home Assistant system timezone.
  log_retention_days:
    name: "Log retention (deprecated)"
    description: >-
      No longer used. Trilium keeps its log files for 90 days.
  log_level:
    name: "Log level (deprecated)"
    description: >-
      No longer used. Kept only for compatibility with existing installations.
  https_only:
    name: "HTTPS only (deprecated)"
    description: >-
      No longer used. TLS is terminated by Home Assistant Ingress or an external reverse proxy.
network:
  8080/tcp: >-
    Optional direct Trilium web interface and sync access. Not required for Ingress.
    Leave blank to disable.
