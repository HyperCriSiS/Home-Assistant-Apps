---
configuration:
  timezone:
    name: "Zeitzone (veraltet)"
    description: >-
      Wird nicht mehr verwendet. Der Container folgt der Systemzeitzone von Home Assistant.
  log_retention_days:
    name: "Log-Aufbewahrung (veraltet)"
    description: >-
      Wird nicht mehr verwendet. Trilium bewahrt seine Logdateien 90 Tage auf.
  log_level:
    name: "Log-Level (veraltet)"
    description: >-
      Wird nicht mehr verwendet. Nur zur Kompatibilität mit bestehenden Installationen vorhanden.
  https_only:
    name: "Nur HTTPS (veraltet)"
    description: >-
      Wird nicht mehr verwendet. TLS wird von Home Assistant Ingress oder einem externen Reverse Proxy terminiert.
network:
  8080/tcp: >-
    Optionaler direkter Zugriff auf die Trilium-Weboberfläche und Synchronisation. Für Ingress nicht
    erforderlich. Leer lassen, um ihn zu deaktivieren.
