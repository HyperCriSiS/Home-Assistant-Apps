server {
    listen 8099;

    # Home Assistant documents 172.30.32.2 as the fixed Supervisor Ingress
    # source inside the managed App network. This is not a user's LAN address.
    # Keep this exact restriction: arbitrary LAN/App clients must not be able
    # to spoof Home Assistant identity headers through the Ingress adapter.
    allow 172.30.32.2;
    deny all;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_max_body_size 16m;

    # MCPHub needs its external base path for browser API requests.
    # Home Assistant supplies the dynamic Ingress path in this header.
    location = /config {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        return 200 "{\"success\":true,\"data\":{\"basePath\":\"$http_x_ingress_path\",\"version\":\"1.1.9\",\"name\":\"MCPHub\"}}";
    }

    # Tunnel dashboard: OpenAI tunnel control and remote access status.
    # Accessible only via authenticated Home Assistant Supervisor Ingress,
    # never from the MCP gateway or the OpenAI tunnel.
    location ^~ /_mcphub_tunnels/ {
        proxy_pass http://127.0.0.1:8093/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Home Assistant Supervisor authenticates the user and injects
        # X-Remote-User-* identity headers. A private proxy secret ensures
        # MCPHub trusts those headers only when they came through this adapter.
        proxy_set_header X-MCPHub-HA-Proxy-Secret "__HA_INGRESS_PROXY_SECRET__";
        proxy_set_header X-Remote-User-Id $http_x_remote_user_id;
        proxy_set_header X-Remote-User-Name $http_x_remote_user_name;
        proxy_set_header X-Remote-User-Display-Name $http_x_remote_user_display_name;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix $http_x_ingress_path;

        # Preserve WebSockets and streamed MCP responses.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

__HOME_ASSISTANT_MCP_SERVER_BLOCK__

# LAN MCP gateway, published on host port 3001 by default. It serves only the
# MCP endpoints; MCPHub's web interface, login and management API stay
# available exclusively through authenticated Home Assistant Ingress. Other
# Apps on the internal Home Assistant network get the same restriction.
server {
    listen 3001;
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_max_body_size 16m;

    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_set_header Authorization "";
    }

    # /mcp, /mcp/<group-or-server> and /mcp/$smart[/<group>]. Nginx matches the
    # normalized URI; forwarding $uri guarantees MCPHub receives exactly that
    # path and never a raw client path with dot segments such as /api/../mcp.
    location ~ "^/mcp(?:/[A-Za-z0-9._$-]+){0,2}$" {
        proxy_pass http://127.0.0.1:3000$uri$is_args$args;
        proxy_http_version 1.1;

        # Lets the tunnel dashboard confirm that a public address really reaches
        # this gateway (an unauthenticated probe expects 401 plus this marker).
        add_header X-MCPHub-Gateway "mcp-only" always;

        # A LAN client must NEVER be trusted as a Supervisor Ingress session.
        proxy_set_header X-MCPHub-HA-Proxy-Secret "";
        proxy_set_header X-Remote-User-Id "";
        proxy_set_header X-Remote-User-Name "";
        proxy_set_header X-Remote-User-Display-Name "";
        proxy_set_header X-Remote-User-Email "";
        proxy_set_header X-Remote-User-Groups "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Proxy-Authorization "";

        # The client's MCPHub bearer key passes through and is validated by MCPHub.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Web interface, login, management API and tunnel console are Ingress-only.
    location / {
        return 404;
    }
}
