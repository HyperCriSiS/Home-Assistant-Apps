---
name: "MCPHub (Dev)"
version: "v2026.10.24-1-dev.131"
slug: mcphub
description: >-
  MCPHub 1.1.10 - central MCP server management with optional Home Assistant,
  OpenAI and remote access integrations
url: "https://github.com/HyperCriSiS/Home-Assistant-Apps/tree/dev-mcphub/MCPHub"
startup: application
boot: auto
init: false
stage: experimental
arch:
  - amd64
  - aarch64
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:hub
panel_title: "MCPHub (Dev)"
panel_admin: true
watchdog: "http://[HOST]:[PORT:8099]/health"
homeassistant_api: true
# Read-only Supervisor info calls: Cloudflared/Tailscale App status, host address.
hassio_api: true
# MCPHub keeps running during backups; re-downloadable package caches are skipped.
backup: hot
backup_exclude:
  - "cache/*"
# MCP gateway (only /mcp endpoints with a bearer key) on host port 3001, used
# by LAN clients and by the Cloudflared and Tailscale Apps for remote access.
# Leave the host port blank to disable it or choose another free port.
ports:
  3001/tcp: 3001
ports_description:
  3001/tcp: >-
    LAN MCP access (only /mcp with an MCPHub bearer key, no web interface):
    default port 3001. Choose another free port if needed. Leave blank to disable.
map:
  - type: ssl
    read_only: true
options:
  openai:
    tunnel_enabled: false
    openai_runtime_api_key: ""
    tunnel_id: ""
    tunnel_mcp_path: "/mcp"
  remote_access:
    external_url: ""
  home_assistant:
    home_assistant_mcp_enabled: false
    home_assistant_mcp_server_name: "ha-home-assistant"
    home_assistant_mcp_auth_mode: "restricted_user"
    home_assistant_mcp_user_token: ""
    home_assistant_mcp_url: "http://homeassistant:8123/api/mcp"
    home_assistant_mcp_ca_file: ""
  github:
    github_cli_mcp_enabled: false
    github_token: ""
  logging:
    tunnel_log_level: "info"
schema:
  openai:
    tunnel_enabled: bool
    openai_runtime_api_key: password
    tunnel_id: str
    tunnel_mcp_path: str
  remote_access:
    external_url: str?
  home_assistant:
    home_assistant_mcp_enabled: bool
    home_assistant_mcp_server_name: str
    home_assistant_mcp_auth_mode: "list(supervisor|restricted_user)"
    home_assistant_mcp_user_token: password
    home_assistant_mcp_url: str
    home_assistant_mcp_ca_file: str?
  github:
    github_cli_mcp_enabled: bool
    github_token: password
  logging:
    tunnel_log_level: "list(debug|info|warn)"
