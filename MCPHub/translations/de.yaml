---
# Home Assistant shows these texts as plain text: no Markdown, no clickable
# links, and line breaks are collapsed into spaces. Keep them short. OpenAI
# links stay here so they can be copied; the Cloudflared and Tailscale App
# links live in MCPHub's "Remote access" tab, where they are clickable.
configuration:
  openai:
    name: "OpenAI Secure Tunnel"
    description: >-
      Verbindet MCPHub mit ChatGPT. Status, Start/Stopp und Logs: MCPHub öffnen → „Remote access“.
    fields:
      tunnel_enabled:
        name: "OpenAI Secure Tunnel aktivieren"
        description: "Macht die gewählte MCP-Route für ChatGPT und andere OpenAI-Clients erreichbar."
      openai_runtime_api_key:
        name: "OpenAI Runtime API Key"
        description: >-
          Restricted-Key mit „Tunnels: Read + Use“ erstellen:
          https://platform.openai.com/settings/organization/api-keys
      tunnel_id:
        name: "OpenAI Tunnel-ID"
        description: "Beginnt mit tunnel_. Zu finden unter https://platform.openai.com/settings/organization/tunnels"
      tunnel_mcp_path:
        name: "OpenAI MCP-Route"
        description: "Zum Beispiel /mcp, /mcp/$smart oder /mcp/<gruppe>."
  remote_access:
    name: "Fernzugriff (Cloudflare, Tailscale)"
    description: >-
      Über die separate Cloudflared- oder Tailscale-App (leitet auf Port 3001 weiter).
      Installationslinks, Status und Anleitung: MCPHub öffnen → „Remote access“.
    fields:
      external_url:
        name: "Basis-URL für MCP-Clients (optional)"
        description: >-
          Ohne Pfad, z. B. https://mcp.example.com oder http://192.168.1.10:3001.
          Gilt für „Copy client config“ und die Adressprüfung unter „Remote access“.
  home_assistant:
    name: "Home Assistant MCP (offiziell)"
    description: "Bindet den MCP-Server von Home Assistant in MCPHub ein."
    fields:
      home_assistant_mcp_enabled:
        name: "Home Assistant MCP aktivieren"
        description: "Voraussetzung: Die Integration „Model Context Protocol Server“ ist eingerichtet."
      home_assistant_mcp_server_name:
        name: "Servername in MCPHub"
        description: "Muss eindeutig sein. Umbenennen kann bestehende MCPHub-Gruppen betreffen."
      home_assistant_mcp_auth_mode:
        name: "Authentifizierung"
        description: >-
          restricted_user: Token eines eigenen, eingeschränkten Benutzers (empfohlen).
          supervisor: automatischer Supervisor-Token.
      home_assistant_mcp_user_token:
        name: "Token des eingeschränkten Benutzers"
        description: "Langlebiger Zugriffstoken dieses Benutzers. Nur für restricted_user."
      home_assistant_mcp_url:
        name: "Home Assistant MCP-URL"
        description: "Nur für restricted_user. LAN-IP, IPv6, DNS-Name, eigener Port und HTTPS möglich."
      home_assistant_mcp_ca_file:
        name: "CA-Datei für HTTPS (optional)"
        description: "Nur bei eigener CA, z. B. /ssl/home-assistant-ca.pem. Sonst leer lassen."
  ha_mcp:
    name: "Home Assistant MCP (inoffiziell)"
    description: >-
      Führt den Community-Server ha-mcp in dieser App aus und bindet ihn in MCPHub ein.
      https://homeassistant-ai.github.io/ha-mcp/
    fields:
      ha_mcp_enabled:
        name: "Inoffizielles Home Assistant MCP aktivieren"
        description: >-
          Volle Kontrolle über Home Assistant, auch die Konfiguration.
          Nutzt immer die neueste Version; Update durch Neustart der App.
      ha_mcp_server_name:
        name: "Servername in MCPHub"
        description: "Muss eindeutig sein. Umbenennen kann bestehende MCPHub-Gruppen betreffen."
      ha_mcp_auth_mode:
        name: "Authentifizierung"
        description: >-
          supervisor: automatischer Supervisor-Token (empfohlen).
          Voller Zugriff auf Home Assistant, aber nicht auf Apps und App-Store;
          dafür die eigene ha-mcp-App verwenden.
          restricted_user: Token eines Benutzers; ohne Admin-Rechte weniger Funktionen.
      ha_mcp_user_token:
        name: "Benutzer-Token"
        description: "Langlebiger Zugriffstoken. Nur für restricted_user."
      ha_mcp_url:
        name: "Home Assistant-URL"
        description: "Nur für restricted_user. Adresse ohne Pfad."
  github:
    name: "GitHub CLI MCP"
    description: "Stellt GitHub-Befehle (gh) als MCP-Server in MCPHub bereit."
    fields:
      github_cli_mcp_enabled:
        name: "GitHub CLI MCP aktivieren"
        description: "Installiert die GitHub CLI bei Bedarf und fügt den gh-cli-mcp-server hinzu."
      github_token:
        name: "GitHub Token (optional)"
        description: "Personal Access Token. Nötig für private Repositories und Schreibzugriffe."
  logging:
    name: "Protokollierung"
    description: "Log-Ausgabe der App."
    fields:
      tunnel_log_level:
        name: "Log-Level OpenAI Tunnel"
        description: "Ausführlichkeit der tunnel-client-Logs."
network:
  3001/tcp: >-
    MCP-Eingang: nur /mcp mit MCPHub-Bearer-Key, keine Weboberfläche.
    Für LAN-Clients und die Cloudflared-/Tailscale-App. Leer = deaktiviert.
