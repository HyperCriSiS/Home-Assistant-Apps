---
name: Update Trilium

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-trilium
  cancel-in-progress: false

jobs:
  update:
    name: Detect Trilium updates and open a validated PR
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}

    steps:
      - name: Check out Trilium development branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: dev-trilium
          fetch-depth: 0
          persist-credentials: false

      - name: Detect latest stable Trilium release
        id: version
        run: |
          current="$(sed -nE 's#^FROM docker\.io/triliumnext/trilium:(v[^[:space:]]+)$#\1#p' \
            'TriliumNext Notes/Dockerfile')"
          latest="$(gh api repos/TriliumNext/Trilium/releases/latest --jq '.tag_name')"

          if [[ -z "${current}" || -z "${latest}" ]]; then
            echo "Could not determine current/latest Trilium version" >&2
            exit 1
          fi

          echo "Current: ${current}"
          echo "Latest:  ${latest}"
          echo "current=${current}" >> "${GITHUB_OUTPUT}"
          echo "latest=${latest}" >> "${GITHUB_OUTPUT}"

          if [[ "${current}" == "${latest}" ]]; then
            echo "update=false" >> "${GITHUB_OUTPUT}"
          else
            echo "update=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify upstream image before changing files
        if: steps.version.outputs.update == 'true'
        env:
          LATEST: ${{ steps.version.outputs.latest }}
        run: docker manifest inspect "docker.io/triliumnext/trilium:${LATEST}" >/dev/null

      - name: Check for an existing update pull request
        if: steps.version.outputs.update == 'true'
        id: existing
        env:
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          branch="automation/trilium-${LATEST}"
          number="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --base dev-trilium \
            --head "${branch}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          {
            echo "branch=${branch}"
            echo "number=${number}"
          } >> "${GITHUB_OUTPUT}"

      # The pull request keeps its original content (and App version date);
      # merge-due-updates.yml regenerates it only when dev-trilium moves.
      - name: Update add-on files with the trusted updater from main
        if: steps.version.outputs.update == 'true' && steps.existing.outputs.number == ''
        env:
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          git fetch --no-tags origin main
          git show origin/main:.github/scripts/update_trilium.py > "${RUNNER_TEMP}/update_trilium.py"
          python3 "${RUNNER_TEMP}/update_trilium.py" \
            --root . \
            --upstream "${LATEST}" \
            --date "$(date -u +%F)"

      - name: Create update branch and pull request
        if: steps.version.outputs.update == 'true' && steps.existing.outputs.number == ''
        env:
          BRANCH: ${{ steps.existing.outputs.branch }}
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "${BRANCH}"
          git add 'TriliumNext Notes/Dockerfile' \
            'TriliumNext Notes/config.yaml' \
            'TriliumNext Notes/README.md' \
            'TriliumNext Notes/CHANGELOG.md'
          git commit -m "chore: update Trilium to ${LATEST}"

          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force "${remote}" "HEAD:refs/heads/${BRANCH}"

          body="$(printf '%s\n\n%s\n%s\n\nUpstream: %s\n' \
            "Automated Trilium update to ${LATEST}." \
            "Merged into dev-trilium automatically 12 hours after opening, once full CI" \
            "passed for the exact commit. The label hold stops it." \
            "https://github.com/TriliumNext/Trilium/releases/tag/${LATEST}")"
          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base dev-trilium \
            --head "${BRANCH}" \
            --title "chore: update Trilium to ${LATEST}" \
            --body "${body}"

      - name: Dispatch full validation for update branch
        if: steps.version.outputs.update == 'true' && steps.existing.outputs.number == ''
        env:
          BRANCH: ${{ steps.existing.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run validate.yml --repo "${GITHUB_REPOSITORY}" --ref "${BRANCH}"

      - name: Close superseded Trilium update pull requests
        if: steps.version.outputs.update == 'true'
        env:
          BRANCH: ${{ steps.existing.outputs.branch }}
        run: |
          gh pr list \
            --repo "${GITHUB_REPOSITORY}" --base dev-trilium --state open \
            --author 'app/github-actions' \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("automation/trilium-"))
              | select(.headRefName != env.BRANCH) | .number' \
            | while read -r number; do
                gh pr close "${number}" --repo "${GITHUB_REPOSITORY}" --delete-branch \
                  --comment "Superseded by ${BRANCH}."
              done
