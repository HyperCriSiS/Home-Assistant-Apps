---
name: HAOS MCPHub integration
# The automatic promotion gate matches this title to the exact tested commit.
run-name: >-
  HAOS MCPHub integration ${{ inputs.sha ||
  (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha) ||
  'dev-mcphub' }}

on:
  workflow_run:
    workflows:
      - Validate MCPHub
    types:
      - completed
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact dev-mcphub commit to test (default: branch head)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: haos-mcphub-integration
  cancel-in-progress: true

jobs:
  haos:
    name: Test MCPHub on dedicated Home Assistant OS
    if: >-
      ${{
        vars.HAOS_E2E_ENABLED == 'true' &&
        (
          github.event_name == 'workflow_dispatch' ||
          (
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'dev-mcphub'
          )
        )
      }}
    runs-on:
      - self-hosted
      - linux
      - haos-addon-test
    timeout-minutes: 25

    steps:
      - name: Check out validated MCPHub commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: >-
            ${{ inputs.sha ||
            (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha) ||
            'dev-mcphub' }}
          persist-credentials: false

      - name: Run Home Assistant OS MCPHub test harness
        env:
          HAOS_EXPECTED_SHA: >-
            ${{ inputs.sha ||
            (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha) || '' }}
          HAOS_ADDONS_DIR: ${{ vars.HAOS_ADDONS_DIR }}
          HAOS_BASE_URL: ${{ vars.HAOS_BASE_URL }}
          HAOS_TOKEN: ${{ secrets.HAOS_TOKEN }}
          HA_CLI: ${{ vars.HA_CLI || 'ha' }}
        run: bash .github/scripts/haos-e2e-mcphub.sh
