---
name: Sync development store

on:
  push:
    branches:
      - dev-trilium
      - dev-mcphub
      - dev-calibre
      - dev-plextraktsync
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-development-store
  cancel-in-progress: true

jobs:
  sync:
    name: Publish combined Home Assistant development store
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Compose dev-store from app development branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin \
            main \
            dev-trilium \
            dev-mcphub \
            dev-calibre \
            dev-plextraktsync \
            dev-store

          git checkout -B dev-store origin/dev-store
          git merge --no-ff --no-edit -X theirs origin/main

          git checkout origin/dev-trilium -- "TriliumNext Notes"
          git checkout origin/dev-mcphub -- "MCPHub"
          git checkout origin/dev-calibre -- "Calibre AIO"
          git checkout origin/dev-plextraktsync -- "PlexTraktSync"
          git checkout origin/main -- repository.json

      - name: Generate development metadata
        env:
          DEV_BUILD: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          state_path = Path(".dev-store-revisions.json")
          if state_path.exists():
              state = json.loads(state_path.read_text(encoding="utf-8"))
          else:
              state = {}

          def source_tree(branch, app_path):
              result = subprocess.run(
                  ["git", "rev-parse", f"{branch}:{app_path}"],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return result.stdout.strip()

          def app_revision(key, branch, app_path):
              tree = source_tree(branch, app_path)
              previous = state.get(key)
              fingerprint = tree
              if key == "mcphub":
                  # Include all MCPHub-specific build, CI and release helpers.
                  related = (
                      "MCPHub",
                      ".github/workflows/validate-mcphub.yml",
                      ".github/workflows/haos-mcphub.yml",
                      ".github/workflows/sync-dev-store.yml",
                      ".github/workflows/promote.yml",
                      ".github/scripts/haos-e2e-mcphub.sh",
                      ".github/scripts/integration-test-mcphub.sh",
                      ".github/scripts/update-mcphub-upstream.py",
                      ".github/scripts/generate-mcphub-changelog.py",
                  )
                  digests = [
                      path + ":" + source_tree(branch, path)
                      for path in related
                  ]
                  fingerprint = hashlib.sha256(
                      "\n".join(digests).encode("utf-8")
                  ).hexdigest()

              if (
                  isinstance(previous, dict)
                  and previous.get("fingerprint", previous.get("tree")) == fingerprint
                  and str(previous.get("revision", "")).isdigit()
              ):
                  revision = int(previous["revision"])
              elif (
                  isinstance(previous, dict)
                  and str(previous.get("revision", "")).isdigit()
              ):
                  revision = int(previous["revision"]) + 1
              else:
                  revision = int(os.environ["DEV_BUILD"])

              state[key] = {
                  "tree": tree,
                  "revision": revision,
              }
              if key == "mcphub":
                  state[key]["fingerprint"] = fingerprint
              return revision

          repository = Path("repository.json")
          repo_data = json.loads(repository.read_text(encoding="utf-8"))
          repo_data["name"] = "HyperCriSiS Apps (Dev)"
          repository.write_text(
              json.dumps(repo_data, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          def patch_config(path, name, panel_title, url, dev_revision):
              config = Path(path)
              text = config.read_text(encoding="utf-8")

              version_match = re.search(
                  r'^version:\s*["\']?([^"\'\n]+)["\']?\s*$',
                  text,
                  flags=re.MULTILINE,
              )
              if version_match is None:
                  raise SystemExit(f"Unable to read version from {path}")

              base_version = re.sub(r"-dev\.\d+$", "", version_match.group(1))
              dev_version = f"{base_version}-dev.{dev_revision}"

              replacements = {
                  "name": f'name: "{name}"',
                  "version": f'version: "{dev_version}"',
                  "panel_title": f'panel_title: "{panel_title}"',
                  "url": f'url: "{url}"',
              }

              for key, value in replacements.items():
                  text, count = re.subn(
                      rf"^{key}:.*$",
                      value,
                      text,
                      count=1,
                      flags=re.MULTILINE,
                  )
                  if count != 1:
                      raise SystemExit(f"Unable to patch {key} in {path}")

              if not re.search(r"^stage:", text, flags=re.MULTILINE):
                  text, count = re.subn(
                      r"^(init:\s*false\s*)$",
                      r"\1\nstage: experimental",
                      text,
                      count=1,
                      flags=re.MULTILINE,
                  )
                  if count != 1:
                      raise SystemExit(
                          f"Unable to add development stage to {path}"
                      )

              config.write_text(text, encoding="utf-8")

          patch_config(
              "PlexTraktSync/config.yaml",
              "PlexTraktSync (Dev)",
              "PlexTraktSync (Dev)",
              "https://github.com/HyperCriSiS/Home-Assistant-Apps/tree/dev-plextraktsync/PlexTraktSync",
              app_revision("plextraktsync", "origin/dev-plextraktsync", "PlexTraktSync"),
          )
          patch_config(
              "Calibre AIO/config.yaml",
              "Calibre AIO (Dev)",
              "Calibre AIO (Dev)",
              "https://github.com/HyperCriSiS/Home-Assistant-Apps/tree/dev-calibre/Calibre%20AIO",
              app_revision("calibre", "origin/dev-calibre", "Calibre AIO"),
          )
          # Stable and Dev may be installed together. Never share writable
          # library/import defaults between these independent installations.
          calibre_config = Path("Calibre AIO/config.yaml")
          calibre_text = calibre_config.read_text(encoding="utf-8")
          for key, folder in (("library_dir", "library"), ("ingest_dir", "ingest")):
              calibre_text, count = re.subn(
                  rf"^  {key}:.*$",
                  f'  {key}: "calibre-aio-dev/{folder}"',
                  calibre_text, count=1, flags=re.MULTILINE,
              )
              if count != 1:
                  raise SystemExit(f"Unable to separate Calibre Dev {key}")
          calibre_config.write_text(calibre_text, encoding="utf-8")

          patch_config(
              "MCPHub/config.yaml",
              "MCPHub (Dev)",
              "MCPHub (Dev)",
              "https://github.com/HyperCriSiS/Home-Assistant-Apps/tree/dev-mcphub/MCPHub",
              app_revision("mcphub", "origin/dev-mcphub", "MCPHub"),
          )
          patch_config(
              "TriliumNext Notes/config.yaml",
              "Trilium Notes (Dev)",
              "Trilium Notes (Dev)",
              "https://github.com/HyperCriSiS/Home-Assistant-Apps/tree/dev-trilium/TriliumNext%20Notes",
              app_revision(
                  "trilium",
                  "origin/dev-trilium",
                  "TriliumNext Notes",
              ),
          )

          state_path.write_text(
              json.dumps(state, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Generate complete MCPHub development changelog
        run: |
          # The workflow checks out main before composing the store. Use the
          # generator from the MCPHub source branch, not from main.
          git show origin/dev-mcphub:.github/scripts/generate-mcphub-changelog.py > /tmp/generate-mcphub-changelog.py
          python3 /tmp/generate-mcphub-changelog.py dev

      - name: Publish generated dev-store branch
        run: |
          git add \
            .dev-store-revisions.json \
            .dev-store-mcphub-changes.json \
            repository.json \
            "MCPHub" \
            "Calibre AIO" \
            "PlexTraktSync" \
            "TriliumNext Notes"
          if ! git diff --cached --quiet; then
            git commit -m "chore(dev-store): compose current app candidates"
          fi
          git push origin HEAD:dev-store
