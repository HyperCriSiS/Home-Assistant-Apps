name: Propose Calibre AIO upstream updates

# Opens one pull request per CWA/Shelfmark combination against dev-calibre.
# merge-due-updates.yml merges it after 12 hours once it matches the trusted
# updater byte for byte and the full validation passed; auto-promote-calibre.yml
# releases it to main after another 48 hours. Label a PR "hold" to stop it.

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: calibre-aio-upstream-updates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dev-calibre
          persist-credentials: false
      - name: Resolve stable upstream releases and verify provenance
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 'Calibre AIO/scripts/upstreams.py' update
          python3 'Calibre AIO/scripts/upstreams.py' check
          python3 'Calibre AIO/scripts/upstreams.py' versions >> "$GITHUB_OUTPUT"
          if git diff --quiet; then echo changed=false; else echo changed=true; fi >> "$GITHUB_OUTPUT"
      - name: Propose version and checksum updates
        id: proposal
        if: steps.versions.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          base: dev-calibre
          branch: automation/calibre-aio-cwa-${{ steps.versions.outputs.cwa }}-shelfmark-${{ steps.versions.outputs.shelfmark }}
          commit-message: 'chore(calibre-aio): update CWA to ${{ steps.versions.outputs.cwa }} and Shelfmark to ${{ steps.versions.outputs.shelfmark }}'
          title: 'chore(calibre-aio): update CWA to ${{ steps.versions.outputs.cwa }} and Shelfmark to ${{ steps.versions.outputs.shelfmark }}'
          body: |
            Updates only the central upstream manifest, generated build arguments,
            app revision and changelog. Integration adapters remain separate.

            The Calibre AIO validation (both architectures, container boot and
            restart) is dispatched for this branch. Once it passed and the PR has
            been open for 12 hours, it is merged into dev-calibre automatically.
            A major upstream version is never released to main automatically.
            Label this PR `hold` to stop the automation.
          add-paths: |
            Calibre AIO/upstream.json
            Calibre AIO/build.yaml
            Calibre AIO/config.yaml
            Calibre AIO/CHANGELOG.md
      - name: Validate the proposed combination on both architectures
        if: steps.proposal.outputs.pull-request-operation == 'created' || steps.proposal.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.proposal.outputs.pull-request-branch }}
        run: gh workflow run validate-calibre-aio.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
