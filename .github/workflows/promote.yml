---
name: Promote app development branches to main

on:
  workflow_run:
    workflows:
      - Validate Trilium
      - Validate MCPHub
      - HAOS integration
      - HAOS MCPHub integration
    types:
      - completed
  workflow_dispatch:
    inputs:
      app:
        description: "Which app should get a release PR?"
        type: choice
        required: true
        default: mcphub
        options:
          - mcphub
          - trilium
          - both
          - calibre

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: promote-app-development-main
  cancel-in-progress: false

jobs:
  promote-calibre:
    name: Prepare manual Calibre AIO release pull request
    if: github.event_name == 'workflow_dispatch' && inputs.app == 'calibre'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}
    steps:
      - name: Verify exact development commit and prepare release PR
        run: |
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev-calibre" --jq '.object.sha')"
          conclusion="$(gh run list --repo "${GITHUB_REPOSITORY}" \
            --workflow validate-calibre-aio.yml --branch dev-calibre --commit "${sha}" \
            --status completed --limit 1 --json conclusion --jq '.[0].conclusion // empty')"
          [[ "${conclusion}" == "success" ]] || {
            echo "Calibre validation is not successful for ${sha}" >&2
            exit 1
          }
          changed="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...dev-calibre" --jq '.files | length')"
          [[ "${changed}" != "0" ]] || exit 0
          existing="$(gh pr list --repo "${GITHUB_REPOSITORY}" --base main \
            --head dev-calibre --state open --json number --jq '.[0].number // empty')"
          [[ -z "${existing}" ]] || exit 0
          cat > /tmp/calibre-release.md <<EOF
          Promotes Calibre AIO from dev-calibre after operator testing.

          Native amd64/aarch64 builds, adapter tests and real container boot/restart
          passed for ${sha}. Verify HA acceptance and current branch checks before
          merging. Manual merge only; this workflow never publishes the app itself.
          EOF
          gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head dev-calibre \
            --title "release(calibre): validated development candidate" \
            --body-file /tmp/calibre-release.md

  promote-trilium:
    name: Maintain Trilium release pull request
    if: >-
      ${{
        (
          github.event_name == 'workflow_dispatch' &&
          (inputs.app == 'trilium' || inputs.app == 'both')
        ) ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'dev-trilium'
        )
      }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}

    steps:
      - name: Verify Trilium release gates
        id: gates
        env:
          HAOS_E2E_ENABLED: ${{ vars.HAOS_E2E_ENABLED }}
        run: |
          sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev-trilium" \
              --jq '.object.sha'
          )"
          conclusion="$(
            gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow validate.yml \
              --branch dev-trilium \
              --commit "${sha}" \
              --status completed \
              --limit 1 \
              --json conclusion \
              --jq '.[0].conclusion // empty'
          )"

          [[ "${conclusion}" == "success" ]] || {
            echo "Trilium validation is not successful for ${sha}" >&2
            exit 1
          }

          if [[ "${HAOS_E2E_ENABLED:-false}" == "true" ]]; then
            haos="$(
              gh run list \
                --repo "${GITHUB_REPOSITORY}" \
                --workflow haos-integration.yml \
                --branch dev-trilium \
                --commit "${sha}" \
                --status completed \
                --limit 1 \
                --json conclusion \
                --jq '.[0].conclusion // empty'
            )"
            [[ "${haos}" == "success" ]] || {
              echo "Trilium HAOS validation is not successful for ${sha}" >&2
              exit 1
            }
          fi

          changed="$(
            gh api "repos/${GITHUB_REPOSITORY}/compare/main...dev-trilium" \
              --jq '.files | length'
          )"
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"

      - name: Create Trilium release pull request
        if: steps.gates.outputs.changed != '0'
        run: |
          existing="$(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head dev-trilium \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [[ -n "${existing}" ]]; then
            echo "Trilium release PR #${existing} already exists"
            exit 0
          fi

          if ! gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --head dev-trilium \
            --title "release(trilium): promote validated candidate" \
            --body "Promotes only the validated Trilium development branch to main."; then
            echo "GitHub Actions could not create the release PR; manual promotion remains available." >&2
          fi

  promote-mcphub:
    name: Maintain MCPHub release pull request
    permissions:
      actions: read
      contents: write
      pull-requests: write
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        (inputs.app == 'mcphub' || inputs.app == 'both')
      }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}

    steps:
      - name: Verify MCPHub release gates
        id: gates
        env:
          HAOS_E2E_ENABLED: ${{ vars.HAOS_E2E_ENABLED }}
        run: |
          sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev-mcphub" \
              --jq '.object.sha'
          )"
          conclusion="$(
            gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow validate-mcphub.yml \
              --branch dev-mcphub \
              --commit "${sha}" \
              --status completed \
              --limit 1 \
              --json conclusion \
              --jq '.[0].conclusion // empty'
          )"

          [[ "${conclusion}" == "success" ]] || {
            echo "MCPHub validation is not successful for ${sha}" >&2
            exit 1
          }

          if [[ "${HAOS_E2E_ENABLED:-false}" == "true" ]]; then
            haos="$(
              gh run list \
                --repo "${GITHUB_REPOSITORY}" \
                --workflow haos-mcphub.yml \
                --branch dev-mcphub \
                --commit "${sha}" \
                --status completed \
                --limit 1 \
                --json conclusion \
                --jq '.[0].conclusion // empty'
            )"
            [[ "${haos}" == "success" ]] || {
              echo "MCPHub HAOS validation is not successful for ${sha}" >&2
              exit 1
            }
          fi

          changed="$(
            gh api "repos/${GITHUB_REPOSITORY}/compare/main...dev-mcphub" \
              --jq '.files | length'
          )"
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"

      - name: Check out the validated MCPHub release source
        if: steps.gates.outputs.changed != '0'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: dev-mcphub
          fetch-depth: 0
          persist-credentials: false

      - name: Draft the consolidated stable changelog and publish release candidate
        if: steps.gates.outputs.changed != '0'
        run: |
          git fetch origin main dev-mcphub
          python3 .github/scripts/generate-mcphub-changelog.py stable

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C release/mcphub-candidate
          git add MCPHub/CHANGELOG.md
          git diff --cached --quiet || git commit -m "docs(mcphub): draft consolidated changes since last stable"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin release/mcphub-candidate >/dev/null 2>&1; then
            git fetch origin +refs/heads/release/mcphub-candidate:refs/remotes/origin/release/mcphub-candidate
            git push --force-with-lease "${remote}" HEAD:refs/heads/release/mcphub-candidate
          else
            git push "${remote}" HEAD:refs/heads/release/mcphub-candidate
          fi

      - name: Open or keep manual MCPHub stable release PR
        if: steps.gates.outputs.changed != '0'
        run: |
          existing="$(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head release/mcphub-candidate \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [[ -n "${existing}" ]]; then
            echo "MCPHub stable release PR #${existing} updated; manual merge only."
            exit 0
          fi

          body="Promotes the reviewed MCPHub candidate. The changelog has one section with all"
          body+=" changes since the last stable release and no commit list; edit the drafted"
          body+=" section before merging. Manual merge only."
          if ! gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --head release/mcphub-candidate \
            --title "release(mcphub): validated candidate" \
            --body "${body}"; then
            echo "Unable to open stable release PR; manual promotion remains available." >&2
          fi
