---
name: Build Inbox Zero base image

# Builds Inbox Zero from one exact commit of the packaged fork and publishes
# ghcr.io/hypercrisis/inbox-zero-base:<commit> for both architectures. The App
# image starts FROM that tag, so the long Next.js build runs once per commit
# instead of once per App version. An existing tag is never rebuilt.
on:
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA of HyperCriSiS/inbox-zero
        type: string
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: inbox-zero-base-${{ inputs.commit }}
  cancel-in-progress: false

env:
  COMMIT: ${{ inputs.commit }}
  IMAGE: ghcr.io/hypercrisis/inbox-zero-base

jobs:
  check:
    name: Look for the published base image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected a full commit SHA' >&2; exit 1; }
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "${IMAGE}:${COMMIT}" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Inbox Zero (${{ matrix.arch }})
    needs: check
    if: needs.check.outputs.exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: HyperCriSiS/inbox-zero
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: docker/Dockerfile.prod
          pull: true
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ inputs.commit }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/HyperCriSiS/Home-Assistant-Apps
            org.opencontainers.image.revision=${{ inputs.commit }}

  manifest:
    name: Publish the tag for both architectures
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --tag "${IMAGE}:${COMMIT}" \
            "${IMAGE}:${COMMIT}-amd64" "${IMAGE}:${COMMIT}-arm64"
