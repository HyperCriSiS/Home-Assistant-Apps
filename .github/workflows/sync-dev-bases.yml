---
name: Sync development branch bases

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-development-branch-bases
  cancel-in-progress: false

jobs:
  sync:
    name: Merge stable main into app development branches
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Sync app development branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The resolver comes from main; a development branch may not have it yet.
          cp .github/scripts/resolve_release_changelog.py "${RUNNER_TEMP}/"
          merge_main() {
            git merge --no-ff --no-edit origin/main || {
              python3 "${RUNNER_TEMP}/resolve_release_changelog.py" &&
                git commit --no-edit --cleanup=strip
            }
          }

          failed=""
          for branch in dev-trilium dev-mcphub dev-calibre dev-inbox-zero; do
            if ! git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
              echo "${branch} does not exist yet; skipping"
              continue
            fi

            git fetch origin main "${branch}"
            git checkout -B "${branch}" "origin/${branch}"

            if git merge-base --is-ancestor origin/main HEAD; then
              echo "${branch} already contains current main"
              continue
            fi

            # A branch that cannot be merged or pushed must not block the others.
            if ! merge_main || ! git push origin "HEAD:${branch}"; then
              git merge --abort 2>/dev/null || true
              failed+=" ${branch}"
            fi
          done

          if [[ -n "${failed}" ]]; then
            echo "::error::Could not sync main into:${failed}"
            exit 1
          fi

      - name: Refresh combined development store
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-dev-store.yml --ref main
