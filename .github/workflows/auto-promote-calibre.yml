name: Auto-promote Calibre AIO updates

# Promotes dev-calibre to main only when it contains nothing but automated
# CWA/Shelfmark pin updates that passed every gate in
# .github/scripts/auto_promote_calibre.py, 3 hours after the newest one
# reached dev-calibre. Everything else stays manual.
# main installs prebuilt images, so both release tags are built, tested and
# published from the gated commit before the merge; a missing tag stops it.
# Pause at any time: set the repository variable CALIBRE_AUTO_PROMOTE=false
# or label the Calibre AIO release pull request "hold".

on:
  schedule:
    - cron: "48 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  packages: write
  pull-requests: write

concurrency:
  # One group per App: a long release of one App never cancels the hourly
  # gate of another (GitHub keeps only one pending run per group).
  group: promote-calibre-main
  cancel-in-progress: false

jobs:
  gate:
    name: Gate bot-only Calibre AIO release
    if: vars.CALIBRE_AUTO_PROMOTE == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}
    outputs:
      action: ${{ steps.gate.outputs.action }}
      main_sha: ${{ steps.gate.outputs.main_sha }}
      dev_sha: ${{ steps.gate.outputs.dev_sha }}
      summary: ${{ steps.gate.outputs.summary }}

    steps:
      - name: Check out trusted gates from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Test promotion gates
        run: python3 -m unittest discover -s .github/tests -p 'test_auto_promote_calibre.py' -v

      - name: Check release gates
        id: gate
        run: python3 .github/scripts/auto_promote_calibre.py gate

      - name: Request validation of the current dev-calibre commit
        if: steps.gate.outputs.action == 'validate'
        run: gh workflow run validate-calibre-aio.yml --repo "$GITHUB_REPOSITORY" --ref dev-calibre

  images:
    name: Publish tested release images from dev-calibre
    needs: gate
    if: needs.gate.outputs.action == 'promote'
    uses: ./.github/workflows/publish-calibre-images.yml
    with:
      source_ref: dev-calibre
    permissions:
      contents: read
      packages: write

  promote:
    name: Merge the exact gated Calibre AIO commit
    needs: [gate, images]
    if: needs.gate.outputs.action == 'promote'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}

    steps:
      - name: Check out trusted gates from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # The Supervisor pulls these tags anonymously as soon as main changes.
      - name: Require both published install images for the gated version
        env:
          DEV_SHA: ${{ needs.gate.outputs.dev_sha }}
        run: |
          set -euo pipefail
          version="$(gh api "repos/${GITHUB_REPOSITORY}/contents/Calibre%20AIO/config.yaml?ref=${DEV_SHA}" \
            --jq '.content' | base64 -d | sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          [[ -n "$version" ]] || { echo 'Could not read the Calibre AIO version' >&2; exit 1; }
          public_config="$(mktemp -d)"
          for arch in amd64 aarch64; do
            image="ghcr.io/hypercrisis/${arch}-calibre-aio:${version}"
            DOCKER_CONFIG="$public_config" docker manifest inspect "$image" >/dev/null \
              || { echo "Install image is not public: ${image}" >&2; exit 1; }
          done

      - name: Re-check and merge the exact validated commit
        id: merge
        env:
          MAIN_SHA: ${{ needs.gate.outputs.main_sha }}
          DEV_SHA: ${{ needs.gate.outputs.dev_sha }}
          SUMMARY: ${{ needs.gate.outputs.summary }}
        run: |
          python3 .github/scripts/auto_promote_calibre.py merge \
            --main-sha "$MAIN_SHA" --dev-sha "$DEV_SHA" --summary "$SUMMARY"

      # GITHUB_TOKEN merges do not start push workflows; request them explicitly.
      - name: Start post-release workflows
        if: steps.merge.outputs.merge_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run validate-calibre-aio.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run sync-dev-bases.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run sync-dev-store.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Watch stable validation and prepare a revert on failure
        if: steps.merge.outputs.merge_sha != ''
        env:
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          python3 .github/scripts/auto_promote_calibre.py watch --merge-sha "$MERGE_SHA"
